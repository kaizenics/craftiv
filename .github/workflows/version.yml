name: Version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: version

jobs:
  bump:
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: v
        run: |
          current=$(node -p "require('./package.json').version")
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            # First run: release the current version as-is.
            next=$current
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log "$last"..HEAD --format='%s%n%b')
            # A breaking change ("feat!:", "fix!:" or a BREAKING CHANGE footer) always bumps the minor.
            # During the 0.x beta a plain feat is only a patch, so minors stay deliberate.
            if echo "$log" | grep -qE '^[a-z]+(\(.+\))?!:|^BREAKING[ -]CHANGE:'; then
              next="$major.$((minor + 1)).0"
            elif [ "$major" -ge 1 ] && echo "$log" | grep -qE '^feat(\(.+\))?:'; then
              next="$major.$((minor + 1)).0"
            else
              next="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Bump, commit, tag
        env:
          NEXT: ${{ steps.v.outputs.next }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.env.NEXT;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet || git commit -m "chore(release): v$NEXT [skip ci]"
          git tag "v$NEXT"
          git push origin HEAD:main "v$NEXT"

      - name: GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.next }}" --prerelease --generate-notes
